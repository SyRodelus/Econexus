<title>MERCOP por departamento</title>
<meta name="claude:viewport-fit-sides" content="cover">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  /* Layout: tarjeta Atra-e (borde superior navy, pestañas subrayadas) con mapa a la izquierda y ranking a la derecha; apila en móvil. */
  :root {
    --bmc-navy: #0A1F5C;
    --bmc-blue: #1E6FC8;
    --bmc-blue-soft: rgba(30, 111, 200, 0.10);
    --heat-0: #E8F0FA;
    --empty: #EEF0F4;
    --bg: #F2F2F2;
    --card: #FFFFFF;
    --line: #E1E4EA;
    --muted: #6B7280;
    --up: #1E7A46;
    --down: #B42318;
    --tip-fg: #DCE6F5;
    --font: "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
  }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--bmc-navy);
    font-family: var(--font);
    padding-block: 20px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    display: flex;
    justify-content: center;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-top: 4px solid var(--bmc-navy);
    border-radius: 10px;
    padding: 24px;
    width: 100%;
    max-width: 920px;
    box-sizing: border-box;
    box-shadow: 0 4px 16px rgba(10, 31, 92, 0.08);
    min-width: 0;
  }
  .header-title { font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.8px; font-weight: 600; }
  .chart-title { font-size: 20px; font-weight: 700; margin: 6px 0 2px; line-height: 1.3; text-wrap: balance; }
  .chart-subtitle { font-size: 13px; color: var(--muted); margin-bottom: 14px; }
  .main-value { font-size: 36px; font-weight: 700; margin: 8px 0 4px; display: flex; align-items: baseline; flex-wrap: wrap; gap: 10px; font-variant-numeric: tabular-nums; }
  .unit { font-size: 18px; color: var(--muted); font-weight: 500; }
  .badge { font-size: 14px; padding: 4px 10px; border-radius: 6px; font-weight: 600; align-self: center; }
  .badge.neutral { background: var(--bmc-blue-soft); color: var(--bmc-navy); }
  .badge.est { background: rgba(180, 35, 24, 0.10); color: var(--down); }
  .delta { font-size: 15px; font-weight: 600; align-self: center; }
  .delta.up { color: var(--up); }
  .meta-info { font-size: 12px; color: var(--muted); margin-bottom: 18px; line-height: 1.5; }
  .controls { display: flex; justify-content: space-between; align-items: flex-end; flex-wrap: wrap; gap: 8px; border-bottom: 1px solid var(--line); margin-bottom: 20px; }
  .timeframes { display: flex; gap: 4px; overflow-x: auto; }
  .tf-btn { background: transparent; border: none; border-bottom: 3px solid transparent; color: var(--muted); padding: 8px 14px; cursor: pointer; font-weight: 600; font-size: 13px; font-family: inherit; white-space: nowrap; }
  .tf-btn:hover { color: var(--bmc-blue); }
  .tf-btn:focus-visible { outline: 2px solid var(--bmc-blue); outline-offset: 2px; }
  .tf-btn.active { color: var(--bmc-navy); border-bottom-color: var(--bmc-blue); }

  .body-grid { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 24px; align-items: start; }
  @media (max-width: 680px) { .body-grid { grid-template-columns: minmax(0, 1fr); } }
  .map-wrap { position: relative; min-width: 0; }
  #mapa { width: 100%; height: auto; display: block; max-height: 560px; }
  #mapa path { stroke: var(--card); stroke-width: 0.9; transition: fill .35s ease, opacity .2s ease; cursor: pointer; }
  #mapa path.hl { fill: none; stroke: var(--bmc-navy); stroke-width: 2.2; pointer-events: none; }
  #mapa .inset { fill: none; stroke: var(--line); stroke-width: 1; }
  #mapa .inset-label { fill: var(--muted); font-size: 7px; font-weight: 600; letter-spacing: .4px; font-family: var(--font); }
  @media (prefers-reduced-motion: reduce) { #mapa path { transition: none; } }

  .legend { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 11px; color: var(--muted); margin-top: 10px; font-variant-numeric: tabular-nums; }
  .legend-bar { height: 8px; width: 140px; border-radius: 4px; background: linear-gradient(90deg, var(--heat-0), var(--bmc-blue) 55%, var(--bmc-navy)); }
  .legend-empty { display: inline-flex; align-items: center; gap: 5px; margin-left: 10px; }
  .legend-empty i { width: 12px; height: 8px; border-radius: 2px; background: var(--empty); border: 1px solid var(--line); }

  .rank-title { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.6px; font-weight: 600; margin-bottom: 10px; }
  .rank { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
  .rank li { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: 4px 10px; align-items: center; padding: 8px 8px; border-radius: 6px; cursor: default; }
  .rank li:hover, .rank li.hi { background: var(--bmc-blue-soft); }
  .rank .pos { font-size: 12px; color: var(--muted); font-weight: 600; text-align: right; font-variant-numeric: tabular-nums; }
  .rank .name { font-size: 14px; font-weight: 600; min-width: 0; overflow-wrap: anywhere; }
  .rank .chip { font-size: 10px; font-weight: 600; color: var(--bmc-blue); background: var(--bmc-blue-soft); border-radius: 4px; padding: 1px 6px; margin-left: 6px; letter-spacing: .3px; vertical-align: 2px; }
  .rank .val { font-size: 14px; font-weight: 700; text-align: right; font-variant-numeric: tabular-nums; }
  .rank .bar { grid-column: 2 / 4; height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
  .rank .bar span { display: block; height: 100%; border-radius: 3px; background: var(--bmc-blue); transition: width .35s ease; }
  .rank .sub { grid-column: 2 / 4; font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }

  .tooltip { position: absolute; pointer-events: none; z-index: 5; background: var(--bmc-navy); color: var(--tip-fg); padding: 10px 12px; border-radius: 6px; font-size: 12px; line-height: 1.5; width: 250px; box-sizing: border-box; box-shadow: 0 4px 12px rgba(10, 31, 92, 0.25); z-index: 2; font-variant-numeric: tabular-nums; }
  .tooltip b { color: var(--card); font-size: 13px; display: block; margin-bottom: 4px; }
  .tooltip .row { display: flex; justify-content: space-between; gap: 10px; }
  .tooltip .row span:last-child { color: var(--card); font-weight: 600; text-align: right; }
  .tooltip .sep { border-top: 1px solid rgba(220, 230, 245, 0.25); margin: 6px 0 4px; }
  .tooltip .mini { font-size: 11px; text-transform: uppercase; letter-spacing: .5px; opacity: .8; margin-bottom: 2px; }
  .tooltip .cap { font-size: 9px; font-weight: 700; background: rgba(30, 111, 200, 0.6); color: var(--card); border-radius: 3px; padding: 0 4px; margin-left: 4px; vertical-align: 1px; }

  .note { font-size: 12px; color: var(--muted); background: var(--bg); border-radius: 6px; padding: 10px 12px; margin-top: 16px; line-height: 1.5; }
  .footnote { font-size: 12px; color: var(--muted); margin-top: 16px; padding-top: 12px; border-top: 1px solid var(--line); display: flex; align-items: center; flex-wrap: wrap; gap: 6px 10px; }
  .dl-btn { margin-left: auto; display: inline-flex; align-items: center; gap: 6px; background: transparent; border: 1px solid var(--line); border-radius: 6px; color: var(--bmc-blue); padding: 6px 12px; font-size: 12px; font-weight: 600; font-family: inherit; cursor: pointer; }
  .dl-btn:hover { border-color: var(--bmc-blue); background: var(--bmc-blue-soft); }
  .dl-btn:focus-visible { outline: 2px solid var(--bmc-blue); outline-offset: 2px; }
  .dl-btn svg { width: 14px; height: 14px; }
</style>

<div class="card">
  <div class="header-title">MERCOP • Bolsa Mercantil de Colombia</div>
  <h1 class="chart-title">Valor negociado en MERCOP por departamento</h1>
  <div class="chart-subtitle">Mercado de Comercialización entre Privados · millones de pesos colombianos (COP)</div>

  <div class="main-value">
    <span id="valor">—</span><span class="unit">COP</span>
    <span id="badge" class="badge neutral"></span>
    <span id="delta" class="delta up"></span>
  </div>
  <div class="meta-info" id="meta"></div>

  <div class="controls">
    <div class="timeframes" id="tfs" role="tablist">
      <button class="tf-btn" id="tf-2024" data-r="2024" title="Estimación 2024 por producto">2024 (est.)</button>
      <button class="tf-btn active" id="tf-2025" data-r="2025" title="Operaciones reales 2025">2025</button>
    </div>
  </div>

  <div class="body-grid">
    <div class="map-wrap" id="mapwrap">
      <svg id="mapa" role="img" aria-label="Mapa de calor de Colombia por departamento"></svg>
      <div class="tooltip" id="tip" hidden></div>
      <div class="legend">
        <span id="leg-min">$0M</span><span class="legend-bar"></span><span id="leg-max"></span>
        <span class="legend-empty"><i></i>Sin operaciones</span>
      </div>
    </div>
    <div style="min-width:0">
      <div class="rank-title" id="rank-title">Ranking</div>
      <ol class="rank" id="rank"></ol>
    </div>
  </div>

  <div class="note" id="nota"></div>

  <div class="footnote">
    <span>Fuente: Bolsa Mercantil de Colombia</span>
    <span>·</span>
    <span id="ultimo-dato">Último dato: dic. 2025</span>
    <button class="dl-btn" id="descargar" type="button" title="Descarga los datos del mapa con sus fuentes y notas">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M5 21h14"/>
      </svg>
      Descargar datos (.xlsx)
    </button>
  </div>
</div>

<script>
  const DATOS = JSON.parse(document.getElementById('mercop-datos').textContent);
  const GEO = JSON.parse(document.getElementById('mercop-geo').textContent);
  const NS = 'http://www.w3.org/2000/svg';
  const fmt = v => '$' + Math.round(v).toLocaleString('es-CO') + 'M';
  const pct = x => (x * 100).toLocaleString('es-CO', { maximumFractionDigits: 1 }) + '%';
  const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

  const NOMBRE = {}; GEO.deps.forEach(d => NOMBRE[d.id] = d.n);
  const CIUDAD = DATOS.nombres_ciudad;
  const porDepto = {}; DATOS.departamentos.forEach(d => porDepto[d.departamento] = d);

  // Escala de color: raíz cuadrada para que los departamentos pequeños no desaparezcan
  const hex = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
  function color(t) {
    const stops = [[0, hex(css('--heat-0'))], [0.55, hex(css('--bmc-blue'))], [1, hex(css('--bmc-navy'))]];
    let i = t <= 0.55 ? 0 : 1;
    const [t0, c0] = stops[i], [t1, c1] = stops[i + 1];
    const k = (t - t0) / (t1 - t0);
    return 'rgb(' + c0.map((c, j) => Math.round(c + (c1[j] - c) * k)).join(',') + ')';
  }

  // Dibujo del mapa
  const svg = document.getElementById('mapa');
  svg.setAttribute('viewBox', `-6 -6 ${GEO.W + 12} ${GEO.H + 12}`);
  const gI = document.createElementNS(NS, 'g'), gD = document.createElementNS(NS, 'g');
  const hl = document.createElementNS(NS, 'path'); hl.setAttribute('class', 'hl'); hl.style.display = 'none';
  svg.append(gI, gD, hl);
  GEO.insets.forEach(b => {
    const r = document.createElementNS(NS, 'rect');
    Object.entries({ x: b.x, y: b.y, width: b.w, height: b.h, rx: 3, class: 'inset' }).forEach(([k, v]) => r.setAttribute(k, v));
    gI.appendChild(r);
    b.label.forEach((l, i) => {
      const tx = document.createElementNS(NS, 'text');
      tx.setAttribute('x', b.x + b.w / 2); tx.setAttribute('y', b.y + b.h + 9 + i * 8);
      tx.setAttribute('text-anchor', 'middle'); tx.setAttribute('class', 'inset-label'); tx.textContent = l;
      gI.appendChild(tx);
    });
  });
  const paths = {};
  GEO.deps.forEach(d => {
    const p = document.createElementNS(NS, 'path');
    p.setAttribute('d', d.d); p.dataset.id = d.id;
    gD.appendChild(p); paths[d.id] = p;
  });

  const tip = document.getElementById('tip'), wrap = document.getElementById('mapwrap');
  function showTip(e, html) {
    tip.innerHTML = html; tip.hidden = false;
    const r = wrap.getBoundingClientRect(), th = tip.offsetHeight;
    let x = e.clientX - r.left + 14, y = e.clientY - r.top + 14;
    if (x + 254 > r.width) x = e.clientX - r.left - 264;
    if (y + th > r.height + 40) y = Math.max(0, e.clientY - r.top - th - 10);
    tip.style.left = Math.max(0, x) + 'px'; tip.style.top = y + 'px';
  }
  const hideTip = () => { tip.hidden = true; };

  let modo = '2025';
  const valorDe = (d, m) => m === '2024' ? d.v2024e : d.v2025;
  const fila = (a, b) => `<div class="row"><span>${a}</span><span>${b}</span></div>`;

  // Indicadores por departamento (los que antes se mostraban por ciudad)
  function tipDepto(id) {
    const d = porDepto[id], v = d ? valorDe(d, modo) : 0;
    if (!v) return `<b>${NOMBRE[id]}</b>Sin operaciones MERCOP ${modo === '2024' ? 'estimadas en 2024' : 'en 2025'}`;
    const orden = DATOS.departamentos.map(x => ({ id: x.departamento, v: valorDe(x, modo) })).filter(x => x.v > 0).sort((a, b) => b.v - a.v);
    const pos = orden.findIndex(x => x.id === id) + 1;
    const total = orden.reduce((s, x) => s + x.v, 0);
    if (modo === '2024') {
      const varp = d.v2024e ? d.v2025 / d.v2024e - 1 : 0;
      return `<b>${NOMBRE[id]}</b>` +
        fila('Puesto', `${pos} de ${orden.length}`) +
        fila('Valor estimado 2024', fmt(d.v2024e)) +
        fila('% de lo asignado', pct(d.v2024e / total)) +
        `<div class="sep"></div>` +
        fila('Valor real 2025', fmt(d.v2025)) +
        fila('Variación 2024 → 2025', (varp >= 0 ? '+' : '') + pct(varp)) +
        `<div class="sep"></div><span style="opacity:.8">Estimación por producto (arroz y leche)</span>`;
    }
    const munis = DATOS.ciudades.filter(c => c.departamento === id).sort((a, b) => b.v - a.v);
    return `<b>${NOMBRE[id]}</b>` +
      fila('Puesto', `${pos} de ${orden.length}`) +
      fila('Valor negociado', fmt(v)) +
      fila('% del total nacional', pct(v / total)) +
      fila('Operaciones', d.ops2025) +
      fila('Ticket promedio', fmt(v / d.ops2025)) +
      fila(`Capital (${CIUDAD[d.capital]})`, `${fmt(d.cap2025)} · ${pct(d.cap2025 / v)}`) +
      `<div class="sep"></div><div class="mini">Municipios (${munis.length})</div>` +
      munis.map(c => fila(`${CIUDAD[c.ciudad]}${c.capital ? '<span class="cap">CAPITAL</span>' : ''}`, `${fmt(c.v)} · ${c.ops} ops`)).join('');
  }

  // Tooltip: aparece al pasar el cursor (o al tocar en pantallas táctiles) y sigue al puntero
  let activo = null;
  Object.entries(paths).forEach(([id, p]) => {
    p.addEventListener('pointerenter', () => { activo = id; marcar(id, true); });
    p.addEventListener('pointermove', e => { if (activo !== id) { activo = id; marcar(id, true); } showTip(e, tipDepto(id)); });
    p.addEventListener('pointerdown', e => { activo = id; marcar(id, true); showTip(e, tipDepto(id)); });
    p.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse') { activo = null; hideTip(); marcar(id, false); } });
  });
  document.addEventListener('pointerdown', e => { if (!e.target.closest('#mapa path')) { activo = null; hideTip(); Object.keys(paths).forEach(k => marcar(k, false)); } });

  // El resaltado se dibuja en una capa aparte: así el departamento no se mueve y el tooltip no se cancela
  function marcar(id, on) {
    if (on && paths[id]) { hl.setAttribute('d', paths[id].getAttribute('d')); hl.style.display = ''; }
    else if (!on) hl.style.display = 'none';
    document.querySelectorAll('#rank li').forEach(li => li.classList.toggle('hi', on && li.dataset.id === id));
  }

  function pintarDeptos(m) {
    const max = Math.max(...DATOS.departamentos.map(d => valorDe(d, m)));
    Object.entries(paths).forEach(([id, p]) => {
      const d = porDepto[id], v = d ? valorDe(d, m) : 0;
      p.style.fill = v > 0 ? color(Math.sqrt(v / max)) : css('--empty');
    });
    return max;
  }

  function ranking(items) {
    const ol = document.getElementById('rank'); ol.innerHTML = '';
    const max = Math.max(...items.map(i => i.v));
    items.forEach((it, i) => {
      const li = document.createElement('li'); li.dataset.id = it.id;
      li.innerHTML = `<span class="pos">${i + 1}</span><span class="name">${it.nombre}</span><span class="val">${fmt(it.v)}</span>` +
        `<span class="bar"><span style="width:${max ? (it.v / max * 100) : 0}%"></span></span><span class="sub">${it.sub}</span>`;
      li.addEventListener('pointerenter', () => marcar(it.id, true));
      li.addEventListener('pointerleave', () => marcar(it.id, false));
      ol.appendChild(li);
    });
  }

  function rango(m) {
    modo = m;
    const badge = document.getElementById('badge'), delta = document.getElementById('delta'), meta = document.getElementById('meta'), nota = document.getElementById('nota');
    const deps = DATOS.departamentos;
    const max = pintarDeptos(m);
    document.getElementById('leg-max').textContent = fmt(max);
    const vals = deps.map(d => ({ d, v: valorDe(d, m) })).filter(x => x.v > 0).sort((a, b) => b.v - a.v);
    const total = vals.reduce((s, x) => s + x.v, 0);
    document.getElementById('rank-title').textContent = m === '2024' ? 'Ranking de departamentos 2024 (estimado)' : 'Ranking de departamentos 2025';
    if (m === '2025') {
      const ops = deps.reduce((s, d) => s + d.ops2025, 0), capT = deps.reduce((s, d) => s + d.cap2025, 0);
      document.getElementById('valor').textContent = fmt(total);
      badge.textContent = 'Año 2025'; badge.className = 'badge neutral';
      delta.textContent = `en ${ops} operaciones`;
      meta.textContent = `${vals.length} departamentos con operaciones · Mayor: ${NOMBRE[vals[0].d.departamento]} ${fmt(vals[0].v)} (${pct(vals[0].v / total)}) · Las capitales concentran ${pct(capT / total)} · Cifra oficial BMC 2025: ${fmt(DATOS.oficial[2025])}`;
      ranking(vals.map(x => ({ id: x.d.departamento, nombre: NOMBRE[x.d.departamento], v: x.v, sub: `${pct(x.v / total)} · ${x.d.ops2025} ops · capital ${CIUDAD[x.d.capital]}: ${fmt(x.d.cap2025)}` })));
      nota.textContent = 'Pasa el cursor por un departamento para ver su puesto, operaciones, ticket promedio, lo negociado en su capital y el detalle por municipio. Datos reales de 2025, depurados de 16 filas duplicadas; la diferencia con la cifra oficial de la BMC es de 1,4%.';
    } else {
      document.getElementById('valor').textContent = fmt(total);
      badge.textContent = 'Año 2024 · estimado'; badge.className = 'badge est';
      delta.textContent = `${pct(total / DATOS.oficial[2024])} del total oficial`;
      meta.textContent = `Total oficial BMC 2024: ${fmt(DATOS.oficial[2024])} en 97 operaciones · No asignable a un departamento: ${fmt(DATOS.oficial[2024] - total)} (queso, equipos de seguridad y otros) · Mayor: ${NOMBRE[vals[0].d.departamento]} ${fmt(vals[0].v)}`;
      ranking(vals.map(x => ({ id: x.d.departamento, nombre: NOMBRE[x.d.departamento], v: x.v, sub: `${pct(x.v / total)} de lo asignado · 2025: ${fmt(x.d.v2025)}` })));
      nota.textContent = 'Estimación, no dato oficial: los montos 2024 de arroz ($26.998M) y leche ($29.588M) publicados por la BMC se repartieron con la geografía de esos mismos productos en 2025. La BMC no publica el MERCOP por departamento antes de 2025.';
    }
  }

  document.getElementById('tfs').addEventListener('click', e => {
    const b = e.target.closest('.tf-btn'); if (!b) return;
    document.querySelectorAll('.tf-btn').forEach(x => x.classList.remove('active'));
    b.classList.add('active'); hideTip(); rango(b.dataset.r);
  });

  // Descarga .xlsx generada a partir del bloque JSON (funciona al abrir el HTML en un navegador)
  function descargarXlsx() {
    const hD = [['Departamento', 'Valor 2024 estimado (M COP)', 'Valor 2025 (M COP)', 'Operaciones 2025', 'Capital', 'Valor 2025 en la capital (M COP)', '% del depto en la capital']];
    DATOS.departamentos.forEach(d => hD.push([NOMBRE[d.departamento], d.v2024e, d.v2025, d.ops2025, CIUDAD[d.capital], d.cap2025, d.v2025 ? d.cap2025 / d.v2025 : 0]));
    const hC = [['Departamento', 'Ciudad', '¿Capital?', 'Valor 2025 (M COP)', 'Operaciones 2025']];
    DATOS.ciudades.forEach(c => hC.push([NOMBRE[c.departamento], CIUDAD[c.ciudad], c.capital ? 'Sí' : 'No', c.v, c.ops]));
    const hF = [['Documento', 'Enlace']]; DATOS.fuentes.forEach(f => hF.push([f.documento, f.url]));
    const hN = [[DATOS.titulo], ['Unidad: ' + DATOS.unidad], ['Elaborado: ' + DATOS.fecha_elaboracion], []];
    DATOS.notas.forEach((n, i) => hN.push([(i + 1) + '. ' + n]));
    const hoja = (f, w) => { const ws = XLSX.utils.aoa_to_sheet(f); ws['!cols'] = w.map(x => ({ wch: x })); return ws; };
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, hoja(hD, [16, 22, 18, 16, 16, 26, 22]), 'Departamentos');
    XLSX.utils.book_append_sheet(wb, hoja(hC, [16, 16, 10, 18, 16]), 'Ciudades 2025');
    XLSX.utils.book_append_sheet(wb, hoja(hF, [60, 110]), 'Fuentes');
    XLSX.utils.book_append_sheet(wb, hoja(hN, [140]), 'Notas');
    XLSX.writeFile(wb, 'mercop_departamentos.xlsx');
  }
  document.getElementById('descargar').addEventListener('click', () => { try { descargarXlsx(); } catch (e) { console.error(e); } });

  rango('2025');
</script>
