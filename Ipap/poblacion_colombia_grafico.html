<title>Población de Colombia</title>
<meta name="claude:viewport-fit-sides" content="cover">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  /* Layout: tarjeta Atra-e (borde navy, cifra grande, pestañas subrayadas) con gráfico de área o barras. */
  :root {
    --bmc-navy: #0A1F5C;
    --bmc-blue: #1E6FC8;
    --bmc-blue-soft: rgba(30, 111, 200, 0.10);
    --s1: #1E4FA8;
    --s2: #D97706;
    --s3: #0E8F7E;
    --bg: #F2F2F2;
    --card: #FFFFFF;
    --line: #E1E4EA;
    --muted: #6B7280;
    --up: #1E7A46;
    --down: #B42318;
  }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--bmc-navy);
    font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
    padding-block: 20px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    display: flex;
    justify-content: center;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-top: 4px solid var(--bmc-navy);
    border-radius: 10px;
    padding: 24px;
    width: 100%;
    max-width: 800px;
    box-sizing: border-box;
    box-shadow: 0 4px 16px rgba(10, 31, 92, 0.08);
    min-width: 0;
  }
  .header-title { font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.8px; font-weight: 600; }
  .chart-title { font-size: 20px; font-weight: 700; margin: 6px 0 2px; line-height: 1.3; text-wrap: balance; }
  .chart-subtitle { font-size: 13px; color: var(--muted); margin-bottom: 14px; }
  .main-value { font-size: 36px; font-weight: 700; margin: 8px 0 4px; display: flex; align-items: baseline; flex-wrap: wrap; gap: 10px; font-variant-numeric: tabular-nums; }
  .unit { font-size: 18px; color: var(--muted); font-weight: 500; }
  .badge { font-size: 14px; padding: 4px 10px; border-radius: 6px; font-weight: 600; align-self: center; }
  .badge.neutral { background: var(--bmc-blue-soft); color: var(--bmc-navy); }
  .badge.est { background: rgba(180, 35, 24, 0.10); color: var(--down); }
  .delta { font-size: 15px; font-weight: 600; align-self: center; }
  .delta.up { color: var(--up); }
  .meta-info { font-size: 12px; color: var(--muted); margin-bottom: 18px; line-height: 1.5; }
  .controls { display: flex; justify-content: space-between; align-items: flex-end; flex-wrap: wrap; gap: 8px; border-bottom: 1px solid var(--line); margin-bottom: 14px; }
  .timeframes { display: flex; gap: 4px; overflow-x: auto; }
  .tf-btn { background: transparent; border: none; border-bottom: 3px solid transparent; color: var(--muted); padding: 8px 14px; cursor: pointer; font-weight: 600; font-size: 13px; font-family: inherit; white-space: nowrap; }
  .tf-btn:hover { color: var(--bmc-blue); }
  .tf-btn:focus-visible { outline: 2px solid var(--bmc-blue); outline-offset: 2px; }
  .tf-btn.active { color: var(--bmc-navy); border-bottom-color: var(--bmc-blue); }
  .seg { display: inline-flex; flex-wrap: wrap; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; margin-bottom: 8px; }
  .seg button { background: transparent; border: none; padding: 6px 12px; font-size: 12px; font-weight: 600; font-family: inherit; color: var(--muted); cursor: pointer; }
  .seg button + button { border-left: 1px solid var(--line); }
  .seg button.on { background: var(--bmc-navy); color: #fff; }
  .seg button:focus-visible { outline: 2px solid var(--bmc-blue); outline-offset: -2px; }
  .legend { display: flex; gap: 18px; flex-wrap: wrap; font-size: 12px; color: var(--muted); margin-bottom: 8px; min-height: 16px; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .legend i { width: 18px; height: 0; border-top: 3px solid; display: inline-block; }
  .chart-container { position: relative; height: 320px; width: 100%; }
  .footnote { font-size: 12px; color: var(--muted); margin-top: 16px; padding-top: 12px; border-top: 1px solid var(--line); display: flex; align-items: center; flex-wrap: wrap; gap: 6px 10px; }
  .dl-btn { margin-left: auto; display: inline-flex; align-items: center; gap: 6px; background: transparent; border: 1px solid var(--line); border-radius: 6px; color: var(--bmc-blue); padding: 6px 12px; font-size: 12px; font-weight: 600; font-family: inherit; cursor: pointer; }
  .dl-btn:hover { border-color: var(--bmc-blue); background: var(--bmc-blue-soft); }
  .dl-btn:focus-visible { outline: 2px solid var(--bmc-blue); outline-offset: 2px; }
  .dl-btn svg { width: 14px; height: 14px; }
  .dl-msg { width: 100%; text-align: right; color: var(--down); }
</style>

<div class="card">
  <div class="header-title">Demografía • DANE</div>
  <h1 class="chart-title">Población de Colombia</h1>
  <div class="chart-subtitle">Proyecciones oficiales con base en el Censo 2018 · personas a 30 de junio de cada año</div>

  <div class="main-value">
    <span id="valor">—</span><span class="unit">personas</span>
    <span id="badge" class="badge neutral"></span>
    <span id="delta" class="delta up"></span>
  </div>

  <div class="meta-info" id="meta"></div>

  <div class="controls">
    <div class="timeframes" id="tfs">
      <button class="tf-btn" data-r="3" title="Últimos 3 años">3A</button>
      <button class="tf-btn" data-r="5" title="Últimos 5 años">5A</button>
      <button class="tf-btn" data-r="10" title="Últimos 10 años">10A</button>
      <button class="tf-btn active" data-r="max" title="2014 – 2026">Máx.</button>
    </div>
    <div class="seg" id="seg" role="group" aria-label="Qué mostrar">
      <button class="on" data-m="total" type="button">Total</button>
      <button data-m="crec" type="button">Aumento anual</button>
      <button data-m="area" type="button">Urbano y rural</button>
      <button data-m="edad" type="button">Por edad</button>
    </div>
  </div>

  <div class="legend" id="legend"></div>

  <div class="chart-container">
    <canvas id="chart" aria-label="Gráfico de la población de Colombia"></canvas>
  </div>

  <div class="footnote">
    <span>Fuente: DANE</span>
    <span>·</span>
    <span id="ultimo-dato"></span>
    <button class="dl-btn" id="descargar" type="button" title="Descarga los datos de la gráfica con sus fuentes y notas">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M5 21h14"/>
      </svg>
      Descargar datos (.xlsx)
    </button>
    <span class="dl-msg" id="dl-msg" hidden></span>
  </div>
</div>

<script>
  const DATOS = JSON.parse(document.getElementById('datos').textContent);
  const A = DATOS.anios;
  A.forEach((d, i) => { const p = A[i - 1]; d.crec = p ? d.total - p.total : null; d.tasa = p ? d.total / p.total - 1 : null; });
  const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  const num = v => Math.round(v).toLocaleString('es-CO');
  const mill = v => (v / 1e6).toLocaleString('es-CO', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' M';
  const pct = (x, d = 1) => (x * 100).toLocaleString('es-CO', { minimumFractionDigits: d, maximumFractionDigits: d }) + '%';
  const sg = x => (x >= 0 ? '+' : '−');

  const SERIES = {
    total: [{ k: 'total', l: 'Población total', c: '--s1' }],
    crec: [{ k: 'crec', l: 'Personas más que el año anterior', c: '--s1' }],
    area: [{ k: 'cabecera', l: 'Cabecera (urbano)', c: '--s1' }, { k: 'rural', l: 'Centros poblados y rural disperso', c: '--s2', dash: [6, 4] }],
    edad: [{ k: 'a014', l: '0 a 14 años', c: '--s3', dash: [2, 3] }, { k: 'a1564', l: '15 a 64 años', c: '--s1' }, { k: 'a65', l: '65 años y más', c: '--s2', dash: [6, 4] }]
  };

  let modo = 'total', rango = 'max', vista = [];
  const ctx = document.getElementById('chart').getContext('2d');
  const grad = ctx.createLinearGradient(0, 0, 0, 300);
  grad.addColorStop(0, 'rgba(30, 79, 168, 0.28)'); grad.addColorStop(1, 'rgba(30, 79, 168, 0.0)');
  let chart = null;

  function construir() {
    if (chart) chart.destroy();
    const ss = SERIES[modo], barras = modo === 'crec';
    chart = new Chart(ctx, {
      type: barras ? 'bar' : 'line',
      data: { labels: vista.map(d => String(d.anio)), datasets: ss.map(s => barras ? {
          label: s.l, data: vista.map(d => d[s.k]), backgroundColor: vista.map(d => d.anio === 2018 ? 'rgba(30,79,168,0.45)' : css(s.c)),
          borderRadius: { topLeft: 4, topRight: 4 }, borderSkipped: 'bottom', maxBarThickness: 36, categoryPercentage: 0.7
        } : {
          label: s.l, data: vista.map(d => d[s.k]), borderColor: css(s.c), borderWidth: 2.5, borderDash: s.dash || [],
          fill: modo === 'total', backgroundColor: modo === 'total' ? grad : 'transparent', cubicInterpolationMode: 'monotone',
          pointRadius: 4, pointBackgroundColor: css(s.c), pointBorderColor: '#FFFFFF', pointBorderWidth: 1.5,
          pointHoverRadius: 7, pointHoverBorderColor: '#FFFFFF', pointHoverBorderWidth: 2
        }) },
      options: {
        responsive: true, maintainAspectRatio: false,
        interaction: { mode: 'index', intersect: false },
        plugins: {
          legend: { display: false },
          tooltip: {
            backgroundColor: '#0A1F5C', titleColor: '#FFFFFF', bodyColor: '#DCE6F5', padding: 12, displayColors: ss.length > 1, usePointStyle: true,
            callbacks: {
              label: c => {
                const d = vista[c.dataIndex], s = ss[c.datasetIndex];
                if (modo === 'crec') return d.crec == null ? 'Sin año anterior en la serie' : [`${sg(d.crec)}${num(Math.abs(d.crec))} personas`, `Crecimiento: ${sg(d.tasa)}${pct(Math.abs(d.tasa), 2)}`];
                const v = d[s.k];
                return modo === 'total' ? `Población: ${num(v)}` : `${s.l}: ${num(v)} (${pct(v / d.total)})`;
              },
              afterBody: items => {
                const d = vista[items[0].dataIndex], out = [];
                if (modo === 'total' && d.crec != null) out.push(`Aumento anual: ${sg(d.crec)}${num(Math.abs(d.crec))} (${sg(d.tasa)}${pct(Math.abs(d.tasa), 2)})`);
                if (modo === 'total') out.push(`Mujeres ${pct(d.mujeres / d.total)} · Hombres ${pct(d.hombres / d.total)}`);
                if (d.anio === 2018) out.push('Cambio de serie: retroproyección → proyección');
                if (d.anio === 2026) out.push('Proyección');
                return out;
              }
            }
          }
        },
        scales: {
          x: { grid: { display: false }, ticks: { color: '#6B7280', maxRotation: 0, autoSkip: true } },
          y: { beginAtZero: modo === 'crec', grid: { color: '#E1E4EA' }, border: { display: false },
               ticks: { color: '#6B7280', callback: v => modo === 'crec' ? (v / 1000).toLocaleString('es-CO') + ' mil' : (v / 1e6).toLocaleString('es-CO') + ' M' } }
        }
      }
    });
    document.getElementById('legend').innerHTML = ss.length > 1
      ? ss.map(s => `<span><i style="border-top-color:${css(s.c)};border-top-style:${s.dash ? (s.dash[0] < 3 ? 'dotted' : 'dashed') : 'solid'}"></i>${s.l}</span>`).join('')
      : (barras && vista.some(d => d.anio === 2018) ? '<span><i style="border-top:8px solid rgba(30,79,168,0.45);width:12px;border-radius:2px"></i>2018: cambio de serie del DANE (retroproyección → proyección)</span>' : '');
  }

  function encabezado() {
    const l = vista[vista.length - 1], f = modo === 'crec' ? A[A.indexOf(vista[0]) - 1] : vista[0];
    document.getElementById('valor').textContent = num(l.total);
    const b = document.getElementById('badge');
    b.textContent = l.anio === 2026 ? 'Año 2026 · proyección' : 'Año ' + l.anio; b.className = 'badge ' + (l.anio === 2026 ? 'est' : 'neutral');
    const crecido = l.total - f.total, tasaP = Math.pow(l.total / f.total, 1 / (l.anio - f.anio)) - 1;
    document.getElementById('delta').textContent = `${sg(crecido)}${mill(Math.abs(crecido))} desde ${f.anio} (${sg(crecido)}${pct(Math.abs(l.total / f.total - 1))})`;
    const conC = vista.filter(d => d.crec != null && d.anio > f.anio);
    const mx = conC.reduce((a, d) => d.crec > a.crec ? d : a, conC[0]);
    let txt = `Crecimiento promedio: ${pct(tasaP, 2)} anual`;
    if (mx) txt += ` · Mayor aumento: ${mx.anio} (${sg(mx.crec)}${num(mx.crec)})`;
    txt += ` · ${l.anio}: ${pct(l.cabecera / l.total)} urbano, ${pct(l.a65 / l.total)} de 65 años y más`;
    if (modo === 'edad') txt += ` · 65+ pasó de ${pct(f.a65 / f.total)} a ${pct(l.a65 / l.total)}`;
    if (modo === 'area') txt += ` · Rural: ${sg(l.rural - f.rural)}${num(Math.abs(l.rural - f.rural))} desde ${f.anio}`;
    document.getElementById('meta').textContent = txt;
  }

  function render() {
    const base = modo === 'crec' ? A.filter(d => d.crec != null) : A;
    vista = rango === 'max' ? base : base.slice(-(Number(rango) + (modo === 'crec' ? 0 : 1)));
    construir(); encabezado();
  }

  document.getElementById('tfs').addEventListener('click', e => {
    const b = e.target.closest('.tf-btn'); if (!b) return;
    document.querySelectorAll('.tf-btn').forEach(x => x.classList.toggle('active', x === b));
    rango = b.dataset.r; render();
  });
  document.getElementById('seg').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    document.querySelectorAll('#seg button').forEach(x => x.classList.toggle('on', x === b));
    modo = b.dataset.m; render();
  });
  document.getElementById('ultimo-dato').textContent = 'Último dato: ' + DATOS.ultimo_dato;

  function descargarXlsx() {
    const msg = document.getElementById('dl-msg');
    if (typeof XLSX === 'undefined') { msg.textContent = 'No se pudo cargar la librería de Excel. Revisa tu conexión e inténtalo de nuevo.'; msg.hidden = false; return; }
    msg.hidden = true;
    const h = [['Año', 'Población total', 'Aumento anual (personas)', 'Crecimiento anual', 'Cabecera (urbano)', 'Centros poblados y rural disperso', 'Hombres', 'Mujeres', '0–14 años', '15–64 años', '65 años y más', 'Serie DANE']];
    A.forEach(d => h.push([d.anio, d.total, d.crec, d.tasa, d.cabecera, d.rural, d.hombres, d.mujeres, d.a014, d.a1564, d.a65, d.serie]));
    const hF = [['ID', 'Documento', 'Enlace']]; DATOS.fuentes.forEach(f => hF.push([f.id, f.documento, f.url]));
    const hN = [[DATOS.titulo], ['Unidad: ' + DATOS.unidad], ['Elaborado: ' + DATOS.fecha_elaboracion], []]; DATOS.notas.forEach((n, i) => hN.push([(i + 1) + '. ' + n]));
    const hoja = (f, w) => { const ws = XLSX.utils.aoa_to_sheet(f); ws['!cols'] = w.map(x => ({ wch: x })); return ws; };
    const wb = XLSX.utils.book_new();
    const ws = hoja(h, [6, 16, 18, 14, 16, 22, 14, 14, 14, 14, 14, 40]);
    for (let r = 2; r <= A.length + 1; r++) { if (ws['D' + r]) ws['D' + r].z = '0.00%'; ['B','C','E','F','G','H','I','J','K'].forEach(c => { if (ws[c + r]) ws[c + r].z = '#,##0'; }); }
    XLSX.utils.book_append_sheet(wb, ws, 'Población');
    XLSX.utils.book_append_sheet(wb, hoja(hF, [5, 90, 110]), 'Fuentes');
    XLSX.utils.book_append_sheet(wb, hoja(hN, [150]), 'Notas');
    const wsF = wb.Sheets['Fuentes']; DATOS.fuentes.forEach((f, i) => { const c = wsF['C' + (i + 2)]; if (c) c.l = { Target: f.url }; });
    XLSX.writeFile(wb, 'poblacion_colombia_2014_2026.xlsx');
  }
  document.getElementById('descargar').addEventListener('click', descargarXlsx);

  render();
</script>
